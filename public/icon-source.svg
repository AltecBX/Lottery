<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#101d3c"/>
      <stop offset="0.55" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#e8a91f"/>
      <stop offset="1" stop-color="#b87709"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#c9d3e2"/>
      <stop offset="1" stop-color="#8e9bb1"/>
    </linearGradient>
    <linearGradient id="ringBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e7fe8"/>
      <stop offset="1" stop-color="#55b0ff"/>
    </linearGradient>
    <linearGradient id="ringGold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d89522"/>
      <stop offset="1" stop-color="#f2c155"/>
    </linearGradient>
    <radialGradient id="ballW" cx="0.33" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#eef2f8"/>
      <stop offset="0.85" stop-color="#c5d0e2"/>
      <stop offset="1" stop-color="#a3b2ca"/>
    </radialGradient>
    <radialGradient id="ballR" cx="0.33" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#ff9a88"/>
      <stop offset="0.5" stop-color="#ee4f41"/>
      <stop offset="0.85" stop-color="#c22a1e"/>
      <stop offset="1" stop-color="#8f1a10"/>
    </radialGradient>
    <filter id="glowB" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softSh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- faint starfield -->
  <g fill="#9db8e8">
    <circle cx="70" cy="90" r="2" opacity="0.5"/>
    <circle cx="440" cy="70" r="1.6" opacity="0.4"/>
    <circle cx="470" cy="200" r="2" opacity="0.35"/>
    <circle cx="50" cy="260" r="1.6" opacity="0.4"/>
    <circle cx="420" cy="330" r="1.7" opacity="0.3"/>
    <circle cx="120" cy="45" r="1.4" opacity="0.4"/>
    <circle cx="330" cy="38" r="1.5" opacity="0.35"/>
    <circle cx="88" cy="330" r="1.8" opacity="0.3"/>
  </g>

  <!-- rising chart line behind the ring -->
  <g opacity="0.5">
    <path d="M120 300 L180 250 L230 272 L300 190 L372 214 L398 150" stroke="#2e7fe8" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <path d="M398 150 l-4 22 M398 150 l-21 8" stroke="#55b0ff" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- analysis ring -->
  <circle cx="256" cy="212" r="152" stroke="url(#ringBlue)" stroke-width="13" fill="none" opacity="0.55" filter="url(#glowB)"/>
  <circle cx="256" cy="212" r="152" stroke="url(#ringBlue)" stroke-width="11" fill="none"/>
  <path d="M 256 60 A 152 152 0 0 1 405.3 183.6" stroke="url(#ringGold)" stroke-width="13" fill="none" stroke-linecap="round"/>
  <circle cx="141.6" cy="303.2" r="9" fill="#f2c155"/>

  <!-- JP monogram (scaled from the 100-box mark) -->
  <g transform="translate(256 208) scale(3.55) translate(-50 -49)" filter="url(#softSh)">
    <path d="M38.5 26 H47 V59.5 C47 66.8 41.8 72 34.6 72 C28 72 22.9 67.6 22 60.9 L30 59.6 C30.5 62.9 32.3 64.6 34.8 64.6 C37.2 64.6 38.5 62.9 38.5 59.8 Z" fill="url(#gold)"/>
    <path fill-rule="evenodd" d="M53 26 H66.5 C74.5 26 80 31.4 80 39 C80 46.6 74.5 52 66.5 52 H61.5 V72 H53 Z M61.5 33.4 V44.6 H66 C69.8 44.6 72 42.4 72 39 C72 35.6 69.8 33.4 66 33.4 Z" fill="url(#silver)"/>
  </g>

  <!-- ball row -->
  <g filter="url(#softSh)" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="62" cy="428" r="39" fill="url(#ballW)"/>
    <text x="62" y="441" font-size="34" fill="#16203a">9</text>
    <circle cx="140" cy="428" r="39" fill="url(#ballW)"/>
    <text x="140" y="441" font-size="34" fill="#16203a">13</text>
    <circle cx="218" cy="428" r="39" fill="url(#ballW)"/>
    <text x="218" y="441" font-size="34" fill="#16203a">28</text>
    <circle cx="296" cy="428" r="39" fill="url(#ballW)"/>
    <text x="296" y="441" font-size="34" fill="#16203a">45</text>
    <circle cx="374" cy="428" r="39" fill="url(#ballW)"/>
    <text x="374" y="441" font-size="34" fill="#16203a">51</text>
    <circle cx="452" cy="428" r="39" fill="url(#ballR)"/>
    <text x="452" y="441" font-size="34" fill="#ffffff">18</text>
  </g>
</svg>
