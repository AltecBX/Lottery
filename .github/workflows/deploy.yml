name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-publish on a schedule so the advertised jackpot stays current: the app
  # reads `jackpots.json` from its own origin (the operators send no CORS
  # headers), so that file is only ever as fresh as the last deploy.
  schedule:
    - cron: '0 */3 * * *'
    # ~1:30 AM Eastern, once the night's draws have settled
    - cron: '30 5 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Never fatal: a failed fetch keeps the committed fallback in place and
      # the app projects the jackpot from its own history instead.
      - name: Refresh advertised jackpots
        run: npm run jackpots
        continue-on-error: true
      # Merges every public source into one history per game — reaches back to
      # 1995 for Powerball, which no single CORS-readable source does.
      - name: Rebuild merged draw histories
        run: npm run history
        continue-on-error: true
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
